// The mod's modules (common and one per loader) are in the root folder; the test mods (the demo books) in testmods/,
// left out with -Ptestmods=false (the Maven workflow does: they need mods from Maven Local).
def loaders = project_loaders.split(",").toList()
(["common"] + loaders).each { include(":$it") }
def testmods = providers.gradleProperty("testmods").getOrElse("true").toBoolean()
loaders.findAll { testmods && file("testmods/$it").isDirectory() }.each { loader ->
    include(":testmod-$loader")
    project(":testmod-$loader").projectDir = file("testmods/$loader")
}

apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v4/settings.gradle"
