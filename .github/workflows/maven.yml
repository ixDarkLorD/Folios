name: Maven
# Publishes each release to the ModResources Maven (the maven/ folder of ixDarkLorD/ModResources), where other mods can
# build against it without a token. A push that changes mod_version in gradle.properties publishes that version; the
# Run workflow button publishes the chosen branch's current version. A version already in the Maven is left alone.
on:
  push:
    paths: [gradle.properties]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time; runs of different branches (or mods) meet at the push to ModResources below.
concurrency:
  group: maven-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check mod_version
        id: changed
        run: |
          prop() { sed -n "s/^$1=//p" "${2:-gradle.properties}" | tr -d '\r'; }
          if [ -z "$(prop dependencies_catalog_version)" ]; then
            echo "This branch has no mod to publish."; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          before='${{ github.event.before }}'
          if [ '${{ github.event_name }}' = push ] && git cat-file -e "$before" 2>/dev/null; then
            git show "$before:gradle.properties" > previous.properties
            if [ "$(prop mod_version previous.properties)" = "$(prop mod_version)" ]; then
              echo "mod_version is still $(prop mod_version)."; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.changed.outputs.publish == 'true'
        with:
          repository: ixDarkLorD/ModResources
          ssh-key: ${{ secrets.MODRESOURCES_DEPLOY_KEY }}
          path: .modresources

      - name: Find the version
        id: version
        if: steps.changed.outputs.publish == 'true'
        run: |
          prop() { sed -n "s/^$1=//p" "${2:-gradle.properties}" | tr -d '\r'; }
          catalog=$(prop dependencies_catalog_version)
          toml=".modresources/maven/net/ixdarklord/sharedcatalogs/$catalog/sharedcatalogs-$catalog.toml"
          entry() { sed -n "s/^$1 *= *\"\([^\",]*\).*/\1/p" "$toml" | head -n1; }
          modid=$(prop modid)
          version="$(entry minecraft)-$(prop mod_version)"
          group="$(prop mod_maven_group | tr . /)/$modid"
          echo "java=$(entry java)" >> "$GITHUB_OUTPUT"
          echo "name=$(prop mod_name) $version" >> "$GITHUB_OUTPUT"
          echo "tasks=$(echo "common,$(prop project_loaders)" | tr , '\n' | sed 's/.*/:&:publishAllPublicationsToModResourcesRepository/' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          if [ -d ".modresources/maven/$group/$modid-common/$version" ]; then
            echo "$modid $version is already in the Maven."; echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # The mod's own Java for the toolchain, and Java 25 (installed last, so the default) to run Gradle: Loom needs 21+.
      - uses: actions/setup-java@v4
        if: steps.version.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: |
            ${{ steps.version.outputs.java }}
            25

      # Each version branch keeps its own Gradle cache (by default only the default branch saves one).
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.publish == 'true'
        with:
          cache-read-only: false

      # Another release may push to ModResources first: then publish again on top of it, so the maven-metadata.xml files
      # list both versions.
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: |
          chmod +x gradlew
          git -C .modresources config user.name '!DARK'
          git -C .modresources config user.email '34784038+ixDarkLorD@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git -C .modresources fetch -q origin HEAD
            git -C .modresources reset -q --hard FETCH_HEAD
            ./gradlew ${{ steps.version.outputs.tasks }} -Pmod_resources="$GITHUB_WORKSPACE/.modresources" -Ptestmods=false \
              -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ steps.version.outputs.java }}_X64 \
              -Pcurseforge_api_token= -Pmodrinth_api_token=
            git -C .modresources add maven
            git -C .modresources commit -q -m "Publish ${{ steps.version.outputs.name }} to the maven"
            git -C .modresources push -q origin HEAD && exit 0
            sleep $((attempt * 10))
          done
          exit 1
