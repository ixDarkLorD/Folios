apply from: "${rootProject.sharedScripts}/common.gradle"

// A plain jar of this module's own classes (Shadow's default bundles the whole runtime classpath).
shadowJar {
    configurations = []
    archiveClassifier = null
}

dependencies {
    // CoolCatLib: events, networking, registries, Canvas's scene viewports and style. Never bundled.
    modCompileOnly("net.ixdarklord.coolcatlib:coolcatlib-common:${coolcatlib_version}") { transitive = false }
}
