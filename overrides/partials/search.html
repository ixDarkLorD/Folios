{#- The search, as a wide field in the bar: the button opens Zensical's search; "/" (or Ctrl+K) does too. -#}
<div class="md-search" data-md-component="search" role="dialog" aria-label="{{ lang.t('search') }}">
  <button type="button" class="md-search__button f-find">
    {% include ".icons/lucide/search.svg" %}
    <span>Find a page or a section…</span>
    <kbd>/</kbd>
  </button>
</div>
