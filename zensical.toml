[project]
site_url = "https://ixdarklord.github.io/Folios/"
site_name = "Folios"
site_description = "Guide books for Minecraft mods, written as JSON in a resource pack."
site_author = "ixDarkLorD"
repo_url = "https://github.com/ixDarkLorD/Folios"
repo_name = "ixDarkLorD/Folios"
copyright = "Copyright &copy; 2026 ixDarkLorD &middot; Use it, build on it and fork it, with credit: <a href=\"/Folios/license/\">Folios License</a>"
extra_css = ["assets/folios.css"]
extra_javascript = ["assets/folios.js"]
# site_description = "Your project description"
# site_author = "Your name"

# copyright = "Copyright &copy; 2026 Your name"

# repo_url = "https://github.com/user/repo"
# repo_name = "user/repo"
# edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Docs" = [
    "docs/index.md",
    { "Your first book" = "docs/getting-started.md" },
    { "Book" = [
      { "book.json" = "docs/book.md" },
      { "Colours" = "docs/colours.md" },
      { "Styles and look" = "docs/styles-and-look.md" },
      { "Celebrations" = "docs/celebrations.md" },
    ] },
    { "Content" = [
      { "Categories and entries" = "docs/categories-and-entries.md" },
      { "Pages" = "docs/pages.md" },
      { "Elements" = [
        { "Text" = "docs/elements/text.md" },
        { "Spotlight" = "docs/elements/spotlight.md" },
        { "Image" = "docs/elements/image.md" },
        { "Recipe" = "docs/elements/recipe.md" },
        { "Entity" = "docs/elements/entity.md" },
        { "Multiblock" = "docs/elements/multiblock.md" },
        { "Structure" = "docs/elements/structure.md" },
        { "Build" = "docs/elements/build.md" },
        { "Build files" = "docs/elements/build-files.md" },
        { "Links" = "docs/elements/links.md" },
        { "Quest" = "docs/elements/quest.md" },
      ] },
      { "Spread and empty" = "docs/spread-and-empty.md" },
      { "Text formatting" = "docs/text-formatting.md" },
    ] },
    { "Progress" = [
      { "Quests and progress" = "docs/quests.md" },
    ] },
    { "For mod developers" = "docs/for-mod-developers.md" },
  ] },
  { "Downloads" = "downloads.md" },
  { "Changelog" = "changelog.md" },
  { "License" = "license.md" },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
custom_dir = "overrides"
favicon = "assets/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

logo = "assets/logo.png"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
