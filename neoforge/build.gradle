apply from: "${rootProject.sharedScripts}/neoforge.gradle"

// Uploaded as <minecraft>+<mod version> (the shared scripts would prefix it with "<minecraft>-").
publisher {
    setProjectVersion("${project.version}")
    // Built and tested on NeoForge 21.1, which runs on Minecraft 1.21.1.
    gameVersions.set(["1.21.1"])
}

// CoolCatLib, which Folios is built on: compiled against and in the dev runs, never bundled.
dependencies {
    modImplementation("net.ixdarklord.coolcatlib:coolcatlib-neoforge:${coolcatlib_version}") { transitive = false }
}
