# ─── Gradle ─────────────────────────────────────────────────────────────────────────────────────────────────────────
# Minecraft decompilation needs the memory; the daemon and build cache keep repeated builds fast.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ─── Build ──────────────────────────────────────────────────────────────────────────────────────────────────────────
# The shared version catalog (net.ixdarklord:sharedcatalogs) and the loaders the mod is built for.
dependencies_catalog_version=1.20.1-v9
project_loaders=forge,fabric
project_game_versions=1.20.1
# The oldest versions the jars accept (the metadata templates read them).
supported_min_mc_version=1.20.1
supported_min_fabric_api_version=0.92.6

# ─── Dev Runs ───────────────────────────────────────────────────────────────────────────────────────────────────────
runtime_min_ram=1G
runtime_max_ram=4G
mixin_debug=false

# ─── Folios ────────────────────────────────────────────────────────────────────────────────────────────────────────
# Versions read <minecraft>+<mod version> (build.gradle), e.g. 26.1.2+1.0.
mod_version=3.1.1
modid=folios
# Maven artifacts: net.ixdarklord.folios:<mod_maven_name>-<loader>
mod_maven_name=folios
mod_name=Folios
mod_description=Guide books for mods, written as JSON in a resource pack: a book on the screen or held open in your hands, with recipes, builds, quests and more.
mod_author=ixDarkLorD
mod_license=LicenseRef-Folios-License
mod_maven_group=net.ixdarklord
mod_source_url=https://github.com/ixDarkLorD/Folios
mod_issue_url=https://github.com/ixDarkLorD/Folios/issues
mod_page_url=https://modrinth.com/mod/folios
mod_forge_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModResources/refs/heads/main/updates/forge/folios.json
mod_fabric_update_url=https://raw.githubusercontent.com/ixDarkLorD/ModResources/refs/heads/main/updates/fabric/folios.json
# Needed on both sides: the server opens books, sends recipes and advancements, and holds the book item.
mod_environment=*
mod_forge_display_test=MATCH_VERSION

# ─── Publishing ─────────────────────────────────────────────────────────────────────────────────────────────────────
project_release_type=release
# true uploads nothing, only shows what would be published
project_upload_debug=true
# Copies each built loader jar to build_jar_output_dir (set in the user's gradle.properties)
copy_build_jar=true
# The Modrinth and CurseForge projects: not made yet.
project_curse_id=1757386
project_modrinth_id=IjbhPhTO
# Dependencies of the uploaded files, by CurseForge/Modrinth slug: requirement[a,b],optional[c]
fabric_publish_dependencies=requirement[coolcatlib,fabric-api],optional[]
forge_publish_dependencies=requirement[coolcatlib],optional[]

# ─── Depends on ─────────────────────────────────────────────────────────────────────────────────────────────────────
# CoolCatLib, from Maven (mavenLocal while developing): the version compiled and run against, and the oldest accepted.
coolcatlib_version=8.0.0+1.20.1
coolcatlib_min_version=8.0.0
