apply from: "${rootProject.sharedScripts}/neoforge.gradle"
apply from: rootProject.file("testmods/testmod.gradle")

// Compile against Folios as a consumer would, but run with only its NeoForge module's own classes (its raw jar): the
// common classes already come in through the "common" configuration.
evaluationDependsOn(":neoforge")
dependencies {
    compileOnly project(path: ":neoforge", configuration: "namedElements")
    runtimeOnly files(project(":neoforge").tasks.named("jar").flatMap { it.archiveFile }).builtBy(":neoforge:jar")
    modImplementation("net.ixdarklord.coolcatlib:coolcatlib-neoforge:${coolcatlib_version}") { transitive = false }
}
