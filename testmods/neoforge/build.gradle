apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v4/neoforge.gradle"
apply from: rootProject.file("testmods/testmod.gradle")

// Compile against Folios as a consumer would, but run with only its NeoForge module's own classes (its raw jar): the
// common classes already come in through the "common" configuration.
evaluationDependsOn(":neoforge")
dependencies {
    compileOnly project(":neoforge")
    runtimeOnly files(project(":neoforge").tasks.named("jar").flatMap { it.archiveFile }).builtBy(":neoforge:jar")
    implementation("net.ixdarklord.coolcatlib:coolcatlib-neoforge:${coolcatlib_version}") { transitive = false }
}

// A recipe viewer in the dev run, picked with -Pdev_viewer=jei or -Pdev_viewer=rei.
dependencies {
    if (project.findProperty("dev_viewer") == "jei") runtimeOnly libs.jei.neoforge
    if (project.findProperty("dev_viewer") == "rei") runtimeOnly libs.rei.neoforge
}
