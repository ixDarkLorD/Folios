apply from: "${rootProject.sharedScripts}/fabric.gradle"
apply from: rootProject.file("testmods/testmod.gradle")

dependencies {
    implementation project(path: ":fabric", configuration: "namedElements")
    modImplementation("net.ixdarklord.coolcatlib:coolcatlib-fabric:${coolcatlib_version}") { transitive = false }
}

// A recipe viewer in the dev run, picked with -Pdev_viewer=jei, -Pdev_viewer=rei or -Pdev_viewer=emi.
dependencies {
    if (project.findProperty("dev_viewer") == "jei") modLocalRuntime libs.jei.fabric
    if (project.findProperty("dev_viewer") == "rei") modLocalRuntime libs.rei.fabric
    if (project.findProperty("dev_viewer") == "emi") modLocalRuntime libs.emi.fabric
}
