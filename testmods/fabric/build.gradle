apply from: "https://raw.githubusercontent.com/ixDarkLorD/ModResources/main/gradle/v4/fabric.gradle"
apply from: rootProject.file("testmods/testmod.gradle")

dependencies {
    implementation project(":fabric")
    implementation("net.ixdarklord.coolcatlib:coolcatlib-fabric:${coolcatlib_version}") { transitive = false }
}

// A recipe viewer in the dev run, picked with -Pdev_viewer=jei or -Pdev_viewer=rei.
dependencies {
    if (project.findProperty("dev_viewer") == "jei") runtimeOnly libs.jei.fabric
    if (project.findProperty("dev_viewer") == "rei") runtimeOnly libs.rei.fabric
}
