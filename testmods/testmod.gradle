// Shared by the test mods, applied after the shared loader scripts: they run with CoolCatLib and Folios, and their IDE
// run configurations are named after the project.
def minecraft = libs.versions.minecraft.get()
def runName = helper.uppercaseFirstChar(project.name)

loom {
    runs {
        configureEach {
            setConfigName("$runName ${helper.uppercaseFirstChar(name)} $minecraft")
        }
    }
}

// MCP Bridge (../MCPBridge-26.1.2) in dev runs only, when it's been published to Maven Local: lets the game be driven from
// outside while it runs, for the Minecraft version it's been published for. Not transitive, so its own CoolCatLib doesn't
// come in beside this build's.
if (new File("${System.getProperty('user.home')}/.m2/repository/net/ixdarklord/mcp_bridge/mcp_bridge-${project.name - 'testmod-'}/${minecraft}-1").exists()) {
    dependencies {
        localRuntime("net.ixdarklord.mcp_bridge:mcp_bridge-${project.name - 'testmod-'}:${minecraft}-1") { transitive = false }
    }
}
